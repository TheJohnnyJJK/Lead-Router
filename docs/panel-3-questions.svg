<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="p3t">
  <title id="p3t">Two question cards: is this our kind of customer, and how urgent does it feel</title>
  <rect width="640" height="200" rx="20" fill="#12162A"/>
  <text x="320" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#B9C0DE" text-anchor="middle">Dispatch checks two things</text>

  <g transform="translate(130,60)">
    <rect width="180" height="110" rx="16" fill="#1B2140" stroke="#3A4276" stroke-width="2"/>
    <rect x="52" y="24" width="76" height="60" rx="6" fill="none" stroke="#5FD9BE" stroke-width="3"/>
    <line x1="64" y1="42" x2="116" y2="42" stroke="#5FD9BE" stroke-width="2.5"/>
    <line x1="64" y1="54" x2="100" y2="54" stroke="#5FD9BE" stroke-width="2.5"/>
    <text x="90" y="100" font-family="Baloo 2, Karla, sans-serif" font-size="13.5" fill="#F5EFE0" text-anchor="middle">"Is this our kind of customer?"</text>
  </g>

  <g transform="translate(330,60)">
    <rect width="180" height="110" rx="16" fill="#1B2140" stroke="#3A4276" stroke-width="2"/>
    <circle cx="90" cy="48" r="24" fill="none" stroke="#5FD9BE" stroke-width="3"/>
    <path d="M90 34v14l10 8" stroke="#5FD9BE" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="100" font-family="Baloo 2, Karla, sans-serif" font-size="13.5" fill="#F5EFE0" text-anchor="middle">"How urgent does this feel?"</text>
  </g>
</svg>
