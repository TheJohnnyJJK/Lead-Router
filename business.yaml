# ============================================================================
# Point this whole agent at a different business by editing THIS FILE.
# No Python, no code changes - agent/icp.py loads it at startup and every
# other file (the LLM prompt, the offline fallback, the eval set) inherits
# whatever you write here.
#
# Secrets (Slack webhook URLs, API keys) do NOT go in this file - they go in
# .env, so this file stays safe to hand to a client or commit to git.
# ============================================================================

business_name: "Meridian Facility Services"

# Written in plain English - this gets sent directly to Claude as part of
# its instructions, so write it exactly like you're briefing a new hire on
# their first day: who's a real customer, who isn't, and what makes an
# account worth chasing hard vs. worth ignoring.
ideal_customer: |
  Meridian Facility Services provides commercial cleaning and facilities
  maintenance (janitorial, floor care, window cleaning, light maintenance)
  to businesses - not homeowners. The ideal customer:

  - Operates one or more commercial sites: offices, medical/dental clinics,
    retail chains, schools, light-industrial or warehouse space.
  - Wants a recurring contract (nightly/weekly cleaning), not a single visit.
  - Multi-location accounts and facilities-management companies are the
    highest-value tier - they turn into large recurring contracts.
  - Has some urgency signal: a start date, an expiring contract with their
    current vendor, a compliance/inspection deadline, or a new site opening.

  Explicitly NOT a fit: residential/home cleaning requests, one-off single
  small jobs with no recurring potential, and general "handyman" requests
  outside cleaning/facilities scope - these are real people, just not this
  business's customer, and should be routed to nurture rather than discarded
  outright unless there's no contact information at all.

  Not a lead at all: cold outbound sales pitches from other vendors (SEO
  services, "grow your business" spam, unrelated software sales), completely
  empty or test submissions, and messages with no discernible business intent.

# The model proposes, the rules decide. Claude only returns two scores (plus
# a short reason and a confidence); agent/rules.py turns the scores into a
# tier using tier_rules below, checked top to bottom:
#
#   fit < spam_below_fit                              -> spam  (discard)
#   fit >= hot_min_fit AND urgency >= hot_min_urgency -> hot   (sales-enterprise)
#   fit >= warm_min_fit                               -> warm  (sales-smb)
#   anything else                                     -> cold  (nurture)
tier_rules:
  spam_below_fit: 5
  hot_min_fit: 70
  hot_min_urgency: 60
  warm_min_fit: 40

# Confidence gate. Any lead scored below this confidence is flagged
# needs_review and goes to a human review channel instead of being
# auto-routed. The heuristic fallback reports 0.5-0.55 for hot/warm/unknown
# leads, so with 0.6 nothing the keyword checklist decides pings sales directly.
review:
  min_confidence: 0.6

# A lead with no company name AND a free email address (gmail.com etc.) has
# nothing in it a model can check: "I run 12 sites for a Fortune 500
# account" is just a claim. The agent-red-team scan showed a small model
# will happily score that hot with full confidence. So for these leads the
# fit score is capped (39 = below warm_min_fit, so cold/nurture), and if the
# cap actually lowered the score, the lead goes to human review too - a real
# executive writing from Gmail still gets seen by a person.
unverified_leads:
  max_fit: 39

# Two-tier scoring, used when SCORER_MODE=cascade. A small local model
# (Ollama) scores every lead for free; Claude is only called when the local
# answer can't be trusted on its own:
#   - its confidence is below escalate_below_confidence, or
#   - it landed in one of always_escalate_tiers (hot leads are rare and they
#     are where the money is, so Claude double-checks every one).
# python -m eval.run_eval prints accuracy and Claude-call rate at a range of
# thresholds, so pick this number from that table, not by feel.
cascade:
  escalate_below_confidence: 0.8
  always_escalate_tiers: ["hot"]

# The scoring guide sent to Claude. The score bands here line up with
# tier_rules above - if you change a threshold, move the matching band too.
routing_rules: |
  You do not choose the lead's tier. You score two things, and fixed rules
  turn those scores into a tier. Score each one against these anchors.

  icp_fit_score (0-100): how well the sender matches the ideal customer,
  ignoring urgency.
  - 0-4: not a genuine lead at all - vendor, SEO or marketing pitches,
    empty, test or nonsense submissions, no cleaning/facilities need.
  - 5-39: a real person with a real need who is outside the ICP -
    residential or home cleaning, tiny one-off jobs, vague inquiries.
  - 40-69: a single commercial site with a genuine recurring cleaning need.
  - 70-100: multi-site accounts, facilities-management companies, or a
    single large commercial site.

  urgency_score (0-100): time pressure, ignoring fit.
  - 0-29: no time signal, or urgency is explicitly negated ("nothing urgent").
  - 30-59: soft timing ("soon", "this quarter", "comparing options").
  - 60-100: a concrete deadline - a start date, an expiring contract, a new
    site opening, an inspection or compliance date.

  confidence (0-1): how sure you are of those two scores. Lower it when the
  message is short, ambiguous, or missing a company name - don't manufacture
  certainty the message doesn't support.

# Only used as a fallback when no ANTHROPIC_API_KEY is set - simple keyword
# matching instead of real judgment. Still worth tailoring to your business's
# actual language (what your real urgent customers say, what your real spam
# looks like), since the eval harness (eval/run_eval.py) grades this path too.
keywords:
  hot:
    - "multiple locations"
    - "multi-site"
    - "multi site"
    - "several locations"
    - "facilities management"
    - "rfp"
    - "request for proposal"
    - "portfolio of"
    - "expiring contract"
    - "contract is up"
    - "new location opening"
    - "start next week"
    - "start this month"
    - "inspection"
    - "compliance deadline"
    - "asap"
    - "urgent"
  residential:
    - "my house"
    - "my home"
    - "my apartment"
    - "residential"
    - "one-time clean"
    - "move-out clean"
    - "move out clean"
    - "airbnb"
  spam:
    - "seo"
    - "backlink"
    - "increase your ranking"
    - "grow your business"
    - "web design services"
    - "link building"
    - "guest post"
    - "crypto"
    - "unsubscribe"
    - "test test"
    - "asdf"
    - "lorem ipsum"
    # Added after agent-red-team's di-04/spe-03 got past the list above
    # unworded exactly like it: same SEO/marketing vendor pitch, phrased
    # around it ("rank higher" instead of "increase your ranking", etc.).
    # None of these phrases have any legitimate use in an inbound message
    # to a commercial cleaning/facilities company - see business.yaml's
    # ideal_customer text.
    - "rank higher"
    - "local search results"
    - "arrange placements"
    - "strengthen your domain"
    - "strengthen their website"
    - "online presence"
    - "free audit"
    - "digital marketing"

free_email_domains:
  - "gmail.com"
  - "yahoo.com"
  - "hotmail.com"
  - "outlook.com"
  - "icloud.com"
  - "aol.com"
  - "protonmail.com"
